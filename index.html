    { id: 'name', type: 'i', opt: 1, t: ['ชื่อ / รหัสพนักงาน — เว้นว่างได้หากไม่ต้องการระบุตัวตน', 'ຊື່ / ລະຫັດພະນັກງານ — ປ່ອຍຫວ່າງໄດ້ຖ້າບໍ່ຕ້ອງການລະບຸຕົວຕົນ', 'ឈ្មោះ / លេខសម្គាល់បុគ្គលិក — អាចទុកចំហបាន ប្រសិនបើមិនចង់បញ្ចេញឈ្មោះ', 'အမည် / ဝန်ထမ်းနံပါတ် — အမည်မဖော်လိုပါက ကွက်လပ်ထားနိုင်သည်'] }
  ]}
];

var DRAFT_KEY = 'nes-draft', LANG_KEY = 'nes-lang';
var li = 0, page = 0, ans = {}, done = false, doneMsg = '', sent = false;

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function t(k) { return UI[k][li]; }

var QS = PAGES.reduce(function (a, p) { return a.concat(p.qs); }, []);
function byId(id) { return QS.filter(function (q) { return q.id === id; })[0]; }
function filled(q) { var v = ans[q.id]; return v !== undefined && String(v).trim() !== ''; }

function progress() {
  if (done) return 100;
  var req = QS.filter(function (q) { return !q.opt; });
  return Math.round(100 * req.filter(filled).length / req.length);
}

function qHtml(q) {
  var head = '<div class="q">' + esc(q.t[li]) + (q.opt ? ' <small>' + t('opt') + '</small>' : '') + '</div>';
  var body;
  if (q.type === 'c') {
    body = '<div class="opts">' + q.o.map(function (o, i) {
      return '<label><input type="radio" name="' + q.id + '" value="' + i + '"' + (ans[q.id] === i ? ' checked' : '') +
        '><span>' + esc(o[li]) + '</span></label>';
    }).join('') + '</div>';
  } else if (q.type === 's') {
    body = '<div class="opts sc">' + FACES.map(function (f, i) {
      var v = i + 1;
      return '<label><input type="radio" name="' + q.id + '" value="' + v + '"' + (ans[q.id] === v ? ' checked' : '') +
        ' aria-label="' + v + '"><span>' + f + '<em>' + v + '</em></span></label>';
    }).join('') + '</div><div class="ends"><span>' + t('lo') + '</span><span>' + t('hi') + '</span></div>';
  } else if (q.type === 't') {
    body = '<textarea rows="3" name="' + q.id + '">' + esc(ans[q.id] || '') + '</textarea>';
  } else {
    body = '<input type="text" name="' + q.id + '" value="' + esc(ans[q.id] || '') + '">';
  }
  return '<div class="card" id="c-' + q.id + '">' + head + body + '<div class="err">' + t('req') + '</div></div>';
}

function render() {
  var app = document.getElementById('app');
  document.getElementById('pb').style.width = progress() + '%';
  if (done) {
    app.innerHTML = '<div class="card done"><div class="big">🙏</div><h2>' + t('thanks') + '</h2><p class="s">' + t('thanksSub') + '</p>' +
      (doneMsg ? '<p>' + t(doneMsg) + '</p>' : '') +
      (sent ? '' : '<p class="s">' + t('dlHint') + '</p><button onclick="download()">' + t('dl') + '</button>') +
      '<p><button class="g" onclick="restart()">' + t('again') + '</button></p></div>';
    return;
  }
  var p = PAGES[page], last = page === PAGES.length - 1;
  app.innerHTML = '<h2>' + esc(p.t[li]) + ' <span class="step">· ' + t('step').replace('{0}', page + 1).replace('{1}', PAGES.length) + '</span></h2>' +
    p.qs.map(qHtml).join('') +
    '<div class="nav">' + (page > 0 ? '<button class="g" onclick="go(-1)">' + t('back') + '</button>' : '') +
    '<button id="nx" onclick="' + (last ? 'submit()' : 'go(1)') + '">' + (last ? t('submit') : t('next')) + '</button></div>';
}

document.getElementById('app').addEventListener('input', function (e) {
  var el = e.target, q = byId(el.name);
  if (!q) return;
  ans[q.id] = el.type === 'radio' ? Number(el.value) : el.value;
  if (filled(q)) document.getElementById('c-' + q.id).classList.remove('bad');
  document.getElementById('pb').style.width = progress() + '%';
  store(DRAFT_KEY, JSON.stringify({ page: page, ans: ans }));
});

function validate() {
  var first = null;
  PAGES[page].qs.forEach(function (q) {
    var bad = !q.opt && !filled(q);
    document.getElementById('c-' + q.id).classList.toggle('bad', bad);
    if (bad && !first) first = q;
  });
  if (first) document.getElementById('c-' + first.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
  return !first;
}

function go(d) {
  if (d > 0 && !validate()) return;
  page = Math.max(0, Math.min(PAGES.length - 1, page + d));
  store(DRAFT_KEY, JSON.stringify({ page: page, ans: ans }));
  render();
  window.scrollTo(0, 0);
}

function avg(dim) {
  var v = QS.filter(function (q) { return q.dim === dim && ans[q.id] !== undefined; }).map(function (q) { return ans[q.id]; });
  return v.length ? Math.round(100 * v.reduce(function (a, b) { return a + b; }, 0) / v.length) / 100 : '';
}

// Leave-risk score 0–100 (see QUESTIONS.md): stay intent 40 + quit thoughts 20 + low satisfaction 40.
function risk() {
  var scale = QS.filter(function (q) { return q.type === 's'; }).map(function (q) { return ans[q.id]; });
  var mean = scale.reduce(function (a, b) { return a + b; }, 0) / scale.length;
  var score = Math.round(ans.stay * 10 + ans.thought * 10 + (5 - mean) / 4 * 40);
  return { risk_score: score, risk_level: score >= 60 ? 'สูง' : score >= 35 ? 'ปานกลาง' : 'ต่ำ' };
}

function payload() {
  var out = { submittedAt: new Date().toISOString(), lang: LANGS[li][0] };
  QS.forEach(function (q) {
    var v = ans[q.id];
    // Choice answers are stored as their Thai label so reports read the same whatever language was used.
    out[q.id] = q.type === 'c' && v !== undefined ? q.o[v][0] : (v === undefined ? '' : v);
  });
  ['job', 'env', 'sup', 'peer', 'overall'].forEach(function (d) { out['avg_' + d] = avg(d); });
  var r = risk();
  out.risk_score = r.risk_score; out.risk_level = r.risk_level;
  return out;
}

function finish(msg, ok) {
  done = true; doneMsg = msg; sent = ok;
  store(DRAFT_KEY, null);
  render();
  window.scrollTo(0, 0);
}

function submit() {
  if (!validate()) return;
  if (!SUBMIT_URL) { finish('', false); return; }
  var btn = document.getElementById('nx');
  btn.disabled = true; btn.textContent = t('sending');
  // text/plain + no-cors avoids a CORS preflight, which Google Apps Script web apps do not answer.
  fetch(SUBMIT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload()) })
    .then(function () { finish('saved', true); })
    .catch(function () { finish('fail', false); });
}

function download() {
  var blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'new-employee-survey-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

function restart() { ans = {}; page = 0; done = false; doneMsg = ''; sent = false; render(); }

function setLang(code) {
  li = Math.max(0, LANGS.map(function (l) { return l[0]; }).indexOf(code));
  store(LANG_KEY, LANGS[li][0]);
  document.documentElement.lang = LANGS[li][0];
  document.title = t('title');
  document.getElementById('h1').textContent = t('h1');
  document.getElementById('intro').textContent = t('intro');
  document.getElementById('lg').innerHTML = LANGS.map(function (l, i) {
    return '<button class="g" data-l="' + l[0] + '" lang="' + l[0] + '" style="opacity:' + (i === li ? 1 : .55) + '" onclick="setLang(\'' + l[0] + '\')">' + l[1] + '</button>';
  }).join('');
  render();
}

(function init() {
  try {
    var d = JSON.parse(load(DRAFT_KEY) || 'null');
    if (d && d.ans) { ans = d.ans; page = Math.min(d.page || 0, PAGES.length - 1); }
  } catch (e) {}
  setLang(load(LANG_KEY) || 'th');
})();
</script>
</body></html>
